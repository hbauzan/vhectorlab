[project]
name = "vhectorlab-backend"
version = "2.3.0"
description = "VHectorLab 3D FastAPI Backend for Vector Arithmetic and Semantic Embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sentence-transformers>=2.5.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.21.0",
    "orjson>=3.11.9",
    "umap-learn==0.5.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

# HF Space / Docker (Linux): CPU wheels only — PyPI Linux torch pulls multi-GB nvidia-*.
# macOS keeps default PyPI (MPS-capable). UV_TORCH_BACKEND alone does NOT affect `uv sync`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["..", "."]
